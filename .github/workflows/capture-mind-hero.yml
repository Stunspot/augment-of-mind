name: Capture generated MIND hero

on:
  push:
    paths:
      - .github/workflows/capture-mind-hero.yml

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Capture and verify generated raster artwork
        env:
          CANVA_URL: >-
            https://media.canva.com/v2/document-image/hash:1961517263/height:335/id:DAHQZ1N3IEU/type:B/width:595?brand=BAFq4tSHhSg&csig=AAAAAAAAAAAAAAAAAAAAAPXkm-AxixVDZzz5b2FZBSZhNdRyKdwol_KyX2RgddXx&disableexport=T&exp=1784996572&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FN3IEU%2FDAHQZ1N3IEU%2F1%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHYGFFNMW3%252F20260724%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260724T175530Z%26X-Amz-Expires%3D80842%26X-Amz-Signature%3D85b55702e6f84a398b90a94de0cabaa4c75e7c3320c8b7092a4c3203c5c5b3a9%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DSat%252C%252025%2520Jul%25202026%252016%253A22%253A52%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAADoXqVsOKL6wC76WrEoxzk25epsCmqvKVPaBrNwk9ZIj&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=1
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image, ImageFilter
          import os

          source = os.environ['CANVA_URL']
          large = source.replace('/height:335/', '/height:1080/').replace('/width:595', '/width:1920')
          payload = None
          used = None
          for label, url in [('large render', large), ('connector render', source)]:
              try:
                  request = Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urlopen(request, timeout=30) as response:
                      candidate = response.read()
                  if candidate.startswith(b'\x89PNG\r\n\x1a\n') and len(candidate) > 10_000:
                      payload = candidate
                      used = label
                      break
              except Exception as exc:
                  print(f'{label} unavailable: {exc}')
          if payload is None:
              raise SystemExit('No valid generated PNG could be retrieved.')

          image = Image.open(BytesIO(payload)).convert('RGB')
          print(f'Captured {used}: {image.width}x{image.height}')
          target = (1600, 900)
          if image.size != target:
              image = image.resize(target, Image.Resampling.LANCZOS)
              image = image.filter(ImageFilter.UnsharpMask(radius=1.2, percent=70, threshold=3))
          output = Path('docs/assets/mind-hero.png')
          output.parent.mkdir(parents=True, exist_ok=True)
          image.save(output, format='PNG', optimize=True)
          check = Image.open(output)
          if check.format != 'PNG' or check.size != target:
              raise SystemExit(f'Raster verification failed: {check.format} {check.size}')
          print(f'Verified {output}: PNG {check.width}x{check.height}, {output.stat().st_size} bytes')
          PY

      - name: Commit the asset and remove this one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/mind-hero.png
          git rm .github/workflows/capture-mind-hero.yml
          git commit -m "Add generated MIND hero artwork"
          git push
