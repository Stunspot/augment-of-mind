name: Enable GitHub Pages through the repository API

on:
  push:
    paths:
      - .github/workflows/enable-pages-api.yml

permissions:
  contents: write
  pages: write

jobs:
  enable:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Inspect or create the Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          headers=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")
          get_code="$(curl -L -sS "${headers[@]}" -o /tmp/pages-get.json -w '%{http_code}' "$api")"
          post_code="not-needed"
          if [ "$get_code" = "404" ]; then
            post_code="$(curl -L -sS -X POST "${headers[@]}" -H 'Content-Type: application/json' -d '{"build_type":"workflow"}' -o /tmp/pages-post.json -w '%{http_code}' "$api")"
          else
            printf '{}' > /tmp/pages-post.json
          fi
          {
            echo "get_http_status=$get_code"
            echo "create_http_status=$post_code"
            echo "get_response=$(tr '\n' ' ' < /tmp/pages-get.json | head -c 1500)"
            echo
            echo "create_response=$(tr '\n' ' ' < /tmp/pages-post.json | head -c 1500)"
            echo
            echo "checked_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > .github/pages-enable-result.txt

      - name: Commit result and remove this one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/pages-enable-result.txt
          git rm .github/workflows/enable-pages-api.yml
          git commit -m "chore: record Pages API enablement result"
          git push
